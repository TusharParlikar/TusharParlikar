name: generate snake animation

on:
  # runs once a day, at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # lets you trigger it by hand from the Actions tab
  workflow_dispatch:
  # regenerates whenever you push to your default branch
  push:
    branches:
      - main   # change this to "master" if that's your repo's default branch

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate the snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
